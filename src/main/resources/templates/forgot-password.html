<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci a senha | Barbearia</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="auth-page">
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-header">
                <span class="brand-mark">S</span>
                <h1>Recuperar senha</h1>
                <p>Informe seu e-mail para receber um token de recuperação.</p>
            </div>

            <form id="forgotPasswordForm">
                <label>
                    <span>E-mail</span>
                    <input type="email" id="email" name="email" required>
                </label>
                <button type="submit" class="btn btn-primary full">Enviar recuperação</button>
            </form>

            <div id="forgotStatus" class="auth-message" style="display:none; margin-top:1rem;">
                Solicitação enviada. Verifique seu e-mail para continuar a redefinição de senha.
            </div>

            <div class="auth-links">
                <a href="/login">Voltar para login</a>
                <a href="/">Início</a>
            </div>
        </div>
    </div>

    <script src="/assets/js/app.js"></script>
</body>
</html>
