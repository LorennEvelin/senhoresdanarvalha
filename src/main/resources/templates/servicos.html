<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços | Barbearia</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
    <header class="topbar">
        <div class="container nav">
            <div class="brand">
                <span class="brand-mark">S</span>
                <div>
                    <strong>Senhores da Navalha</strong>
                    <small>Serviços</small>
                </div>
            </div>
            <button class="nav-toggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
            <nav class="nav-menu">
                <a href="/">Home</a>
                <a href="/sobre">Sobre</a>
                <a href="/servicos">Serviços</a>
                <a href="/equipe">Equipe</a>
                <a href="/contato">Contato</a>
            </nav>
            <div class="nav-actions">
                <a class="btn btn-outline" href="/login">Entrar</a>
                <a class="btn btn-primary" href="/cadastro">Agendar</a>
            </div>
        </div>
    </header>

    <main class="container page-shell">
        <section class="cards-grid">
            <article class="service-highlight"
                     th:each="servico, stat : ${servicos}"
                     th:with="icones=${ {'✂️','🪒','💇','🧴','🎨'} }">
                <span class="icon" th:text="${icones[stat.index % 5]}">✂️</span>
                <h3 th:text="${servico.nome}">Corte Masculino</h3>
                <p th:text="${servico.descricao}">Estilo moderno e clássico com acabamento perfeito.</p>
                <p><strong th:text="${'R$ ' + #numbers.formatDecimal(servico.valor, 1, 'POINT', 2, 'COMMA')}">R$ 55,00</strong>
                   · <span th:text="${servico.duracao + ' min'}">45 min</span></p>
            </article>
            <article class="service-highlight">
                <span class="icon">✨</span>
                <h3>Outros serviços</h3>
                <p>Atendimento sob medida com soluções personalizadas.</p>
            </article>
        </section>
    </main>
    <script src="/assets/js/app.js"></script>
</body>
</html>
