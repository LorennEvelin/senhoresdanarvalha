<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda | Barbearia</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
    <header class="topbar">
        <div class="container nav">
            <div class="brand">
                <span class="brand-mark">S</span>
                <div>
                    <strong>Senhores da Navalha</strong>
                    <small>Agenda</small>
                </div>
            </div>
            <nav>
                <a href="/">Home</a>
                <a href="/sobre">Sobre</a>
                <a href="/servicos">Serviços</a>
                <a href="/equipe">Equipe</a>
                <a href="/contato">Contato</a>
            </nav>
            <div class="nav-actions">
                <a class="btn btn-outline" href="/login">Entrar</a>
                <a class="btn btn-primary" href="/cadastro">Agendar</a>
            </div>
        </div>
    </header>

    <main class="container page-shell">
        <section class="agenda-panel">
            <h1>Agenda de horários</h1>
            <div class="cards-grid">
                <div class="stat-card">
                    <span>Segunda</span>
                    <strong>09:00 - 19:00</strong>
                </div>
                <div class="stat-card accent">
                    <span>Terça</span>
                    <strong>09:00 - 19:00</strong>
                </div>
                <div class="stat-card">
                    <span>Quarta</span>
                    <strong>09:00 - 19:00</strong>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
