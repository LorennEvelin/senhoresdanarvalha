<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipe | Barbearia</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
    <header class="topbar">
        <div class="container nav">
            <div class="brand">
                <span class="brand-mark">S</span>
                <div>
                    <strong>Senhores da Navalha</strong>
                    <small>Equipe</small>
                </div>
            </div>
            <button class="nav-toggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
            <nav class="nav-menu">
                <a href="/">Home</a>
                <a href="/sobre">Sobre</a>
                <a href="/servicos">Serviços</a>
                <a href="/equipe">Equipe</a>
                <a href="/contato">Contato</a>
            </nav>
            <div class="nav-actions">
                <a class="btn btn-outline" href="/login">Entrar</a>
                <a class="btn btn-primary" href="/cadastro">Agendar</a>
            </div>
        </div>
    </header>

    <main class="container page-shell">
        <section class="team-grid"
                 th:with="fotos=${ {'https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=900&q=80',
                                   'https://images.unsplash.com/photo-1517832606299-7ae9b720a186?auto=format&fit=crop&w=900&q=80',
                                   'https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=900&q=80'} }">
            <article class="team-card" th:each="barbeiro, stat : ${barbeiros}">
                <img class="team-photo" th:src="${fotos[stat.index % 3]}" th:alt="${'Barbeiro ' + barbeiro.nome}">
                <div class="avatar" th:text="${#strings.substring(barbeiro.nome, 0, 1)}">R</div>
                <h3 th:text="${barbeiro.nome}">Rafael</h3>
                <p th:text="${barbeiro.especialidade}">Especialista em cortes clássicos e barbas impecáveis.</p>
            </article>
        </section>
    </main>
    <script src="/assets/js/app.js"></script>
</body>
</html>
