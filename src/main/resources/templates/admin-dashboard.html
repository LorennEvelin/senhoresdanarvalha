<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração | Barbearia</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
    <header class="topbar">
        <div class="container nav">
            <div class="brand">
                <span class="brand-mark">S</span>
                <div>
                    <strong>Senhores da Navalha</strong>
                    <small>Administração</small>
                </div>
            </div>
            <button class="nav-toggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
            <nav class="nav-menu">
                <a href="/admin/dashboard">Dashboard</a>
                <a href="/admin/servicos">Serviços</a>
                <a href="/admin/barbeiros">Barbeiros</a>
                <a href="/admin/configuracoes">Configurações</a>
                <a href="/logout">Sair</a>
            </nav>
        </div>
    </header>

    <main class="container page-shell">
        <section class="cards-grid">
            <div class="stat-card">
                <span>Clientes</span>
                <strong th:text="${totalClientes}">0</strong>
            </div>
            <div class="stat-card accent">
                <span>Serviços</span>
                <strong th:text="${totalServicos}">0</strong>
            </div>
            <div class="stat-card">
                <span>Barbeiros</span>
                <strong th:text="${totalBarbeiros}">0</strong>
            </div>
        </section>

        <section class="agenda-panel">
            <h2>Serviços cadastrados</h2>
            <ul class="history-list">
                <li th:each="servico : ${servicos}">
                    <div>
                        <strong th:text="${servico.nome}">Corte</strong>
                        <small th:text="${servico.descricao}">Descrição</small>
                    </div>
                    <span class="tag" th:text="${servico.valor}">R$ 0,00</span>
                </li>
            </ul>
        </section>
    </main>
</body>
</html>
