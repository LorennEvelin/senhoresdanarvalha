spring.application.name=Barbearia Senhores da Navalha
server.port=${PORT:8081}

# Banco de dados persistente em arquivo para apresentar ao tutor sem depender do MySQL local
spring.datasource.url=jdbc:h2:file:./data/barbearia;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL init
spring.sql.init.mode=embedded
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# JWT
# Em produção defina as variáveis de ambiente; os valores após ":" são apenas para desenvolvimento
jwt.secret=${JWT_SECRET:senhoresdaNavaLhaSuperSegredoJWT2026!@#}
jwt.expiration=86400000

# Senhas iniciais das contas criadas automaticamente
app.seed.admin-senha=${ADMIN_SENHA:admin123}
app.seed.cliente-senha=${CLIENTE_TESTE_SENHA:cliente123}

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
